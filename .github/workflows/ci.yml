name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository and needs no Cloudflare credentials.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Runs on the invented example content, with models replaced by the offline path.
      - run: npm run check
        env:
          CONTENT_MODE: example
